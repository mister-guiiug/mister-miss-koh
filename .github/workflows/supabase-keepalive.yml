# Anti-pause Supabase Free — appelant planifié du réutilisable du socle.
#
# Trois pièces, aucune n'est facultative : la table `keep_alive`
# (migration 0005), les deux secrets ci-dessous, et ce workflow. Sans la
# table, le ping répond 404 en silence et le projet se met en pause au bout
# de sept jours. Vérifier par `gh workflow run supabase-keepalive.yml`, pas
# en attendant le prochain cron.
#
# LA TENSION EST LEVÉE : le réutilisable déclare ces deux valeurs en
# `secrets:`, mais un appelant a le droit d'y passer N'IMPORTE QUELLE
# expression — y compris `vars`. L'URL et la clé anonyme sont publiques (Vite
# les copie dans le bundle) et vivent donc en `vars`, une seule fois, comme le
# déploiement les lit. Aucun secret à poser, aucune valeur en double.
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 5 */3 * *' # ~tous les 3 jours, décalé de mister-molkky
  workflow_dispatch:

jobs:
  keepalive:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-supabase-keepalive.yml@v4
    # Nommés, pas hérités : le réutilisable déclare exactement ces deux
    # entrées. Les valeurs viennent des VARIABLES du dépôt, pas des secrets.
    secrets:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
