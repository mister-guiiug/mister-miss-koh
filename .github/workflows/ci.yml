# CI déléguée au workflow réutilisable de la famille.
#
# Aucun héritage du trousseau : le réutilisable ne consomme aucun secret ici, et
# hériter lui donnerait le trousseau entier du dépôt pour rien.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # `--strict` : une dette suffit désormais à faire échouer le job. Ce dépôt
      # est le SEUL des dix-huit qui lancent le docteur à rendre « 0 défaut(s),
      # 0 dette(s) » (mesuré le 19/09/2026 en jouant `--strict` pour de vrai). Le
      # passage ne coûte donc rien ici, et il interdit la prochaine régression
      # au lieu de l'inscrire dans un journal que personne ne lit.
      doctor-strict: true
      # Aucune suite Playwright ici : `@playwright/test` n'est pas installé et
      # le dépôt ne contient pas une seule spec (relevé du 19/09/2026). Il n'y
      # a donc rien à jouer — et le réutilisable ferait échouer le job plutôt
      # que de sortir vert sur zéro test. À repasser à `true` le jour où une
      # suite `e2e/` existe.
      run-e2e: false
      # Second avis TypeScript 7, NON BLOQUANT. La 6 reste la référence : c'est
      # elle que typescript-eslint résout, et il refuse la 7.0 par une assertion
      # à l'import. Le jour où typescript-eslint#10940 se ferme, cette entrée
      # et l'alias `typescript-7` disparaissent ensemble.
      run-type-check-7: true

  # Les Edge Functions sont du Deno : hors du périmètre de `pwa-ci`, qui ne
  # connaît que Node. Leurs 90 tests tournent ici, sans base et sans réseau.
  edge:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Version VERROUILLÉE sur celle du poste où les 90 tests ont été
      # exécutés. `v2.x` a pris une version plus récente dont le formateur ne
      # rend pas le même résultat : une CI rouge sans qu'une ligne ait changé.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Lint · Format · Types
        working-directory: supabase/functions
        run: deno lint && deno fmt --check && deno check _shared/*.ts import-wikipedia/index.ts
      - name: Tests
        working-directory: supabase/functions
        run: deno test --allow-read _shared/
