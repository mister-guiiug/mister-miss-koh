# Migrations Supabase, fonctions Edge, et les secrets dont la planification a
# besoin — automatiquement, à chaque poussée sur `main`.
#
# CE DÉPÔT N'AVAIT AUCUN WORKFLOW QUI APPLIQUE SES MIGRATIONS, et ça s'est payé
# deux fois : `0022` et `0023` sont restées en attente pendant que le site
# répondait « Could not find the function », CI verte pendant tout ce temps ;
# puis la planification de l'import (`0026`) serait restée un fichier tant que
# personne n'aurait tapé `supabase db push`. Une CI verte ne disait rien de
# l'état de la base — elle le dit maintenant.
#
# `paths` couvre AUSSI `supabase/functions/**` : la fonction Edge est déployée
# par le même passage, et une planification qui appelle une fonction d'une
# version antérieure aux tables qu'elle lit n'aurait aucun sens.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ⚠ Ne PAS déclarer de `concurrency` ici : le réutilisable porte le sien
  # (groupe `supabase-migrate`, sans annulation), et le répéter provoque
  # « deadlock was detected for concurrency group ».
  migrate:
    name: Migrations et fonctions
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-supabase-migrate.yml@v4
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # La référence du projet est PUBLIQUE — elle est dans l'URL du site.
      # Rangée en variable, passée dans le slot, qui accepte l'expression.
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    with:
      deploy-functions: true

  secrets-planification:
    name: Secrets de la planification
    # APRÈS les migrations, et pas avant : c'est `0027` qui crée la fonction
    # par laquelle les secrets du Vault entrent.
    needs: migrate
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CRON_SECRET: ${{ secrets.IMPORT_CRON_SECRET }}
    steps:
      - name: Vérifier ce qui est nécessaire
        run: |
          missing=
          [ -z "$PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID (variable)"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$CRON_SECRET" ] && missing="$missing IMPORT_CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Manquant :$missing — Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # LA FONCTION EDGE ET LA BASE DOIVENT PARTAGER LE MÊME SECRET. C'est ici
      # qu'il devient unique : GitHub en est la source, la fonction et le Vault
      # en reçoivent une copie au même passage. Une rotation se fait donc en
      # changeant UNE valeur, puis en relançant ce workflow.
      - name: Poser le secret de la fonction Edge
        run: |
          supabase secrets set "IMPORT_CRON_SECRET=$CRON_SECRET" \
            --project-ref "$PROJECT_ID" >/dev/null
          echo "IMPORT_CRON_SECRET posé sur la fonction Edge."

      - name: Poser les trois secrets du Vault
        run: |
          set -euo pipefail

          # Les clés d'API se DEMANDENT, elles ne se rangent pas en secret de
          # dépôt : le jeton d'accès suffit à les obtenir, et une clé tournée
          # côté Supabase est reprise au passage suivant sans qu'on touche à
          # GitHub.
          keys=$(supabase projects api-keys --project-ref "$PROJECT_ID" -o json)
          anon=$(printf '%s' "$keys" | jq -r '.[] | select(.name == "anon") | .api_key')
          service=$(printf '%s' "$keys" | jq -r '.[] | select(.name == "service_role") | .api_key')

          if [ -z "$anon" ] || [ "$anon" = "null" ] || [ -z "$service" ] || [ "$service" = "null" ]; then
            echo "::error::clés d'API illisibles pour $PROJECT_ID"
            exit 1
          fi
          # Masquées AVANT tout usage : une commande qui échoue imprime souvent
          # son contexte, et `set -x` d'un futur débogage les cracherait.
          echo "::add-mask::$anon"
          echo "::add-mask::$service"

          url="https://$PROJECT_ID.supabase.co"

          poser() {
            # `--fail-with-body` : sans lui, une erreur PostgREST rend 4xx avec
            # un corps explicite que `curl -f` jetterait, et le journal ne
            # dirait que « exit 22 ».
            curl --fail-with-body -sS -X POST \
              "$url/rest/v1/rpc/definir_secret_planification" \
              -H "apikey: $service" \
              -H "Authorization: Bearer $service" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg n "$1" --arg v "$2" '{p_nom: $n, p_valeur: $v}')" \
              >/dev/null
            echo "  $1 posé."
          }

          poser koh_functions_url "$url/functions/v1"
          poser koh_anon_key "$anon"
          poser koh_import_cron_secret "$CRON_SECRET"

      - name: Ce que la planification fera au prochain tour
        run: |
          echo "Deux tâches pg_cron sont en place :"
          echo "  koh-import-quotidien   17 4 * * *          les 18 pages"
          echo "  koh-import-diffusion   */30 14-22 * * 2,3  la saison en diffusion"
          echo "Le résultat de chaque import se lit dans import_runs."
