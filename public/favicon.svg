<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Aventure Tracker — une flamme abstraite au-dessus d’une vague</title>
  <!--
    Identité ORIGINALE : une flamme stylisée (l'aventure, le feu) posée sur
    une vague (l'océan), dans une pastille terre. Aucun élément de l'émission
    n'est repris — ni totem, ni logo, ni typographie.
  -->
  <rect width="64" height="64" rx="14" fill="#12201c"/>
  <path d="M12 46c6-6 10-2 14 0s8 6 14 0 8-4 12 0" fill="none" stroke="#5eead4" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M32 12c-2 6-9 9-9 17a9 9 0 0 0 18 0c0-4-2-6-3-8-1 3-3 4-4 4 1-4-1-9-2-13z" fill="#f97316"/>
  <path d="M32 24c-1 3-4 4-4 8a4 4 0 0 0 8 0c0-3-2-4-2-6-1 1-1 2-2 2 0-2 0-3 0-4z" fill="#fde68a"/>
</svg>
