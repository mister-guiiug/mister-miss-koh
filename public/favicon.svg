<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Mister &amp; miss Koh — une flamme, de la braise à l’ambre</title>
  <!--
    LA SOURCE UNIQUE DE LA MARQUE. Ce fichier est servi tel quel par l'en-tête
    de l'application, il fait le favicon, et `npm run icons` en tire les six
    PNG du manifeste plus l'icône maskable. Le modifier suffit à changer les
    trois surfaces ; il n'existe aucune autre copie du logo.

    LA SILHOUETTE VIENT DE LUCIDE (icône `flame`, licence ISC), le jeu d'icônes
    dont l'interface entière est faite : la marque parle donc la même langue
    que les cinquante icônes de l'application. Aucun élément de l'émission
    n'est repris — ni totem, ni logo, ni typographie.

    ELLE EST REMPLIE, PAS TRACÉE. Lucide dessine au trait ; vérifié dans le
    navigateur, le remplir donne la même silhouette pleine sous `nonzero` et
    sous `evenodd`, mais fait disparaître la boucle intérieure. C'est voulu :
    au trait, la marque pesait moins que les icônes installées qui l'entourent
    sur un écran d'accueil.

    LA TUILE RESTE UNIE. Le maskable est fabriqué en réduisant cette image puis
    en comblant le pourtour d'une couleur unie : l'option « bg » de
    `package.json`, réglée sur 18,32,28, la teinte exacte du rectangle
    ci-dessous. Une tuile en dégradé rendrait ce raccord impossible et poserait
    un liseré autour de l'icône installée. Le dégradé est donc sur la FLAMME,
    pas sur le fond.

    (Et l'option ne peut pas s'écrire ici avec ses deux tirets : XML interdit
    le double tiret dans un commentaire, et le rasteriseur refuse le fichier.)
  -->
  <defs>
    <linearGradient id="feu" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c2410c" />
      <stop offset=".55" stop-color="#f97316" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#12201c" />
  <!--
    `translate(11 11) scale(1.75)` : la grille de Lucide fait 24 unités, et une
    icône y est centrée sur (12, 12). Le facteur porte la marque à 42 unités,
    soit 65 % de la tuile — sous les 80 % de la zone de sécurité du masque
    circulaire, donc rien n'est rogné à l'installation.
  -->
  <g transform="translate(11 11) scale(1.75)">
    <path
      d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
      fill="url(#feu)"
    />
  </g>
</svg>
